name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install IANA timezone data on Windows
        if: runner.os == 'Windows'
        run: python -m pip install tzdata
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Check CLI version
        run: python collect_automation_audit.py --version

  required-check:
    name: Tests passed
    if: ${{ always() }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Verify the complete test matrix
        shell: bash
        run: |
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "One or more operating-system/Python test jobs failed."
            exit 1
          fi
